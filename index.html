<!doctype html>
<html lang="en-IN">
<head>
  <!-- Basic Settings -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eee9e1" />
  <meta name="color-scheme" content="light" />

  <!-- Primary SEO -->
  <title>Adunnati- Build. Market. Grow.</title>

  <meta
    name="description"
    content="Adunnati is a digital marketing and growth agency offering website development, branding, Meta Ads, Google Ads, lead generation, creative production and performance marketing."
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://www.adunnati.com/"
  />

  <!-- Open Graph: Facebook, WhatsApp & LinkedIn -->
  <meta property="og:type" content="website" />

  <meta
    property="og:site_name"
    content="Adunnati"
  />

  <meta
    property="og:title"
    content="Adunnati — Build. Market. Grow."
  />

  <meta
    property="og:description"
    content="Better brands. Smarter marketing. Real growth. Discover digital strategy, creative services and performance marketing solutions at Adunnati."
  />

  <meta
    property="og:url"
    content="https://www.adunnati.com/"
  />

  <meta property="og:locale" content="en_IN" />

  <!-- X / Twitter -->
  <meta
    name="twitter:card"
    content="summary"
  />

  <meta
    name="twitter:title"
    content="Adunnati — Build. Market. Grow."
  />

  <meta
    name="twitter:description"
    content="Digital strategy, creative experiences and performance marketing that drive real business growth."
  />

  <!-- Favicons -->
  <link
    rel="icon"
    type="image/x-icon"
    href="/favicon.ico"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  />

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://www.adunnati.com/#organization",
    "name": "Adunnati",
    "url": "https://www.adunnati.com/",
    "description": "Adunnati is a digital growth agency providing digital strategy, website development, branding, creative production, lead generation and performance marketing services."
  }
  </script>

  <!-- Website Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://www.adunnati.com/#website",
    "name": "Adunnati",
    "url": "https://www.adunnati.com/",
    "inLanguage": "en-IN",
    "publisher": {
      "@id": "https://www.adunnati.com/#organization"
    }
  }
  </script>

</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.tsx"
  ></script>
</body>
</html>
